<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr. Snowman — Coming Soon</title>
<meta name="description" content="He was never a snowman. Coming soon.">

<!--
  ============================================================
  HOW TO SWAP PICTURES LATER (read this, then delete it)
  ============================================================
  images/hero.jpg      -> the main poster art, shown large in
                           the first screen
  images/artifact.jpg  -> the smaller "found photo" in the
                           second section

  To change either image, just replace the file at that path
  with a new one of the same name — nothing else needs editing.
  If a file is ever missing, the page falls back gracefully
  (a CSS-only title stands in for the hero; the photo frame
  just goes empty).
  ============================================================
-->

<style>
  @import url('https://fonts.googleapis.com/css2?family=Creepster&family=Gaegu:wght@400;700&family=Special+Elite&display=swap');

  :root{
    --parchment: #d9cfa9;
    --parchment-dark: #c7bb90;
    --ink: #2a2318;
    --rust: #6f2a1a;
    --mold: #5c6a3d;
    --mold-light: #7c8a52;
    --stain: #8a7a4a;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    padding:0;
    background: var(--parchment);
    color: var(--ink);
    font-family: 'Gaegu', cursive;
    overflow-x:hidden;
    cursor: default;
  }

  /* ---------- grain + vignette overlay ---------- */
  .grain{
    pointer-events:none;
    position:fixed;
    inset:0;
    z-index:50;
    opacity:0.16;
    mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    animation: grainShift 1.1s steps(4) infinite;
  }
  @keyframes grainShift{
    0%{ transform:translate(0,0); }
    25%{ transform:translate(-1%,1%); }
    50%{ transform:translate(1%,-1%); }
    75%{ transform:translate(-1%,-1%); }
    100%{ transform:translate(0,0); }
  }
  .vignette{
    pointer-events:none;
    position:fixed;
    inset:0;
    z-index:49;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(15,10,5,0.75) 100%);
  }
  .glitch-flash{
    pointer-events:none;
    position:fixed;
    inset:0;
    z-index:60;
    background: rgba(255,255,255,0);
    mix-blend-mode: difference;
    opacity:0;
  }
  .glitch-flash.active{
    opacity:1;
    background: rgba(200,40,20,0.08);
  }

  /* ---------- hero ---------- */
  .hero{
    position:relative;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 6vh 5vw;
    overflow:hidden;
    background:
      radial-gradient(ellipse at 20% 15%, rgba(92,106,61,0.35), transparent 45%),
      radial-gradient(ellipse at 85% 80%, rgba(111,42,26,0.30), transparent 50%),
      radial-gradient(ellipse at 50% 50%, var(--parchment) 0%, var(--parchment-dark) 60%, #24200f 130%);
  }

  .hero-content{
    position:relative;
    z-index:2;
  }

  /* ---------- featured poster art ---------- */
  .poster-wrap{
    position:relative;
    display:inline-block;
    margin: 0 auto;
    transform: rotate(-1.1deg);
  }
  .poster-img{
    display:block;
    max-width: min(460px, 88vw);
    max-height: 80vh;
    width:auto;
    height:auto;
    border: 6px solid #efe6c9;
    box-shadow:
      0 18px 40px rgba(10,8,4,0.6),
      0 0 0 1px rgba(0,0,0,0.4);
    filter: contrast(1.05) saturate(0.92);
  }
  .poster-fallback-title{
    display:none;
  }
  .poster-wrap.img-missing .poster-fallback-title{
    display:block;
  }

  .kicker{
    font-family:'Special Elite', monospace;
    letter-spacing:0.35em;
    font-size:0.7rem;
    text-transform:uppercase;
    color: var(--rust);
    margin-bottom:1.4rem;
    opacity:0.85;
  }

  h1.poster-fallback-title{
    font-family:'Creepster', cursive;
    font-size: clamp(3.2rem, 12vw, 8rem);
    line-height:0.95;
    margin:0;
    color: #efe6c9;
    letter-spacing:0.02em;
    text-shadow:
      0 0 6px rgba(239,230,201,0.35),
      0 0 22px rgba(111,42,26,0.55),
      3px 3px 0 rgba(20,15,8,0.9);
    animation: flicker 5.5s infinite;
    transform: rotate(-1.2deg);
  }
  h1.poster-fallback-title .not{
    display:block;
    font-family:'Special Elite', monospace;
    font-size: clamp(0.75rem, 2vw, 1rem);
    letter-spacing:0.25em;
    color: var(--mold-light);
    text-shadow:none;
    margin-top:0.8rem;
    text-transform:uppercase;
    text-decoration: line-through;
    text-decoration-color: rgba(111,42,26,0.7);
    text-decoration-thickness: 2px;
    opacity:0.75;
  }

  @keyframes flicker{
    0%, 3%, 6%, 100%{ opacity:1; }
    4%{ opacity:0.4; }
    5%{ opacity:0.85; }
    46%{ opacity:1; }
    47%{ opacity:0.55; }
    48%{ opacity:1; }
    72%{ opacity:1; }
    73%{ opacity:0.3; }
    74%{ opacity:1; }
  }

  .scroll-hint{
    position:absolute;
    bottom: 2.2rem;
    left:50%;
    transform: translateX(-50%);
    z-index:2;
    font-family:'Special Elite', monospace;
    font-size:0.65rem;
    letter-spacing:0.3em;
    text-transform:uppercase;
    color: rgba(239,230,201,0.5);
    animation: bob 2.6s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{ transform: translate(-50%,0); opacity:0.5; }
    50%{ transform: translate(-50%,8px); opacity:0.9; }
  }

  /* ---------- storybook section ---------- */
  .storybook{
    position:relative;
    background: var(--parchment-dark);
    padding: 8vh 6vw 10vh;
    display:flex;
    flex-wrap:wrap;
    gap: 4rem;
    align-items:center;
    justify-content:center;
    border-top: 2px dashed rgba(42,35,24,0.3);
  }
  .storybook::before{
    content:"";
    position:absolute;
    inset:0;
    background: radial-gradient(ellipse at 10% 90%, rgba(92,106,61,0.25), transparent 55%);
    pointer-events:none;
  }

  .photo-frame{
    position:relative;
    width: min(280px, 70vw);
    background:#e9e2c4;
    padding: 0.9rem 0.9rem 2.6rem;
    box-shadow: 0 10px 25px rgba(20,15,8,0.4);
    transform: rotate(3deg);
    z-index:1;
  }
  .photo-frame .photo-inner{
    position:relative;
    aspect-ratio: 1/1;
    overflow:hidden;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(92,106,61,0.5), transparent 60%),
      radial-gradient(ellipse at 70% 80%, rgba(111,42,26,0.45), transparent 65%),
      linear-gradient(160deg, #3a3222, #171208);
  }
  .photo-frame .photo-inner img{
    width:100%;
    height:100%;
    object-fit:cover;
    filter: sepia(0.4) contrast(1.05);
  }
  .photo-frame .caption{
    position:absolute;
    bottom:0.6rem;
    left:0;
    right:0;
    text-align:center;
    font-family:'Special Elite', monospace;
    font-size:0.7rem;
    letter-spacing:0.05em;
    color: var(--ink);
    opacity:0.6;
  }

  .storybook-text{
    max-width: 28rem;
    font-size: clamp(1.1rem, 2.3vw, 1.4rem);
    line-height:1.6;
  }
  .storybook-text p{ margin: 0 0 1rem; }
  .storybook-text .whisper{
    font-family:'Special Elite', monospace;
    font-size:0.85rem;
    letter-spacing:0.06em;
    color: var(--rust);
    opacity:0.85;
  }

  footer{
    text-align:center;
    padding: 3rem 5vw 3.5rem;
    background: #1c170d;
    color: rgba(217,207,169,0.55);
    font-family:'Special Elite', monospace;
    font-size:0.75rem;
    letter-spacing:0.15em;
  }
  footer .foot-title{
    font-family:'Creepster', cursive;
    font-size:1.4rem;
    color: rgba(217,207,169,0.8);
    letter-spacing:0.05em;
    margin-bottom:0.6rem;
  }

  @media (max-width: 640px){
    .storybook{ flex-direction:column; text-align:center; }
    .storybook-text{ max-width: 90vw; }
  }
</style>
</head>
<body>

<div class="grain"></div>
<div class="vignette"></div>
<div class="glitch-flash" id="glitchFlash"></div>

<section class="hero">
  <div class="hero-content">
    <div class="kicker">every family has one</div>

    <div class="poster-wrap" id="posterWrap">
      <h1 class="poster-fallback-title">MR. SNOWMAN
        <span class="not">he is not a snowman. he never was.</span>
      </h1>
      <img class="poster-img" src="hero.jpg" alt="Mr. Snowman — coming soon"
           onerror="document.getElementById('posterWrap').classList.add('img-missing'); this.style.display='none';">
    </div>

  </div>

  <div class="scroll-hint">keep going &darr;</div>
</section>

<section class="storybook">
  <div class="photo-frame">
    <div class="photo-inner">
      <!-- Swap by adding artifact.jpg — shows automatically -->
      <img src="artifact.jpg" alt="" onerror="this.style.display='none'">
    </div>
    <div class="caption">the last picture from that summer</div>
  </div>

  <div class="storybook-text">
    <p>She says he visits at night.</p>
    <p>She says he's not a snowman.</p>
    <p>She's right. He never was.</p>
    <p class="whisper">it isn't a phase. it's in the blood.</p>
  </div>
</section>

<footer>
  <div class="foot-title">Mr. Snowman</div>
  an original story &middot; coming soon
</footer>

<script>
  // Occasional glitch flash for unease
  const flash = document.getElementById('glitchFlash');
  function scheduleGlitch(){
    const delay = 4000 + Math.random() * 6000;
    setTimeout(() => {
      flash.classList.add('active');
      setTimeout(() => flash.classList.remove('active'), 90 + Math.random() * 80);
      scheduleGlitch();
    }, delay);
  }
  scheduleGlitch();

  // Tab title changes when you look away
  const originalTitle = document.title;
  const awayTitle = "come back.";
  document.addEventListener('visibilitychange', () => {
    document.title = document.hidden ? awayTitle : originalTitle;
  });
</script>

</body>
</html>
